<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแชร์ ศนป.กอ.รมน.</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f3f4f6; margin: 0; text-align: center; }
    .loader { border: 5px solid #f3f3f3; border-top: 5px solid #06C755; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { margin-top: 20px; color: #333; font-weight: bold; padding: 0 20px; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p id="status">กำลังเตรียมข้อมูลเพื่อแชร์ต่อ...</p>

  <script>
    // 🚨 LIFF ID ของคุณ
    const LIFF_ID = "2010041585-Xig31aUQ"; 

    // ฟังก์ชันย่อลิงก์เพื่อป้องกันปัญหาลิงก์ยาวเกิน 1000 ตัวอักษร
    async function getShortUrl(longUrl) {
      try {
        const response = await fetch("https://tinyurl.com/api-create.php?url=" + encodeURIComponent(longUrl));
        if (response.ok) { return await response.text(); }
      } catch (e) { console.log("Shorten failed", e); }
      return longUrl;
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        // ดึงข้อมูลจาก URL
        const p = new URLSearchParams(window.location.search);
        
        // กำหนดรูปภาพสำรอง (ป้องกันระบบล่มถ้ารูปหาย)
        const defaultImg = "https://via.placeholder.com/800x450.png?text=No+Image";

        const data = {
          type: p.get('type') || "24",
          loc: p.get('loc') || "ไม่ระบุพื้นที่",
          dis: p.get('dis') || "แจ้งเตือนภัย",
          det: p.get('det') || "-",
          mimg: p.get('mimg') || defaultImg,
          link: p.get('link') || "https://www.isoc.go.th/",
          bimg: p.get('bimg') || defaultImg,
          limg: p.get('limg') || defaultImg,
          rimg: p.get('rimg') || defaultImg
        };

        const isUrgent = (data.type == "24");

        document.getElementById('status').innerText = "กำลังสร้างลิงก์แชร์...";

        // 🚨 นำลิงก์เต็มไปย่อให้สั้นก่อนใส่ในปุ่ม (แก้ปัญหาแชร์แล้วแชทเงียบ)
        const fullUrl = "https://liff.line.me/" + LIFF_ID + window.location.search;
        let shareUrl = await getShortUrl(fullUrl);
        if(shareUrl.length > 1000) { shareUrl = "https://liff.line.me/" + LIFF_ID; } // กันเหนียวชั้นที่ 2

        document.getElementById('status').innerText = "กรุณาเลือกเพื่อนที่จะแชร์";

        // ส่ง Share Target Picker
        const result = await liff.shareTargetPicker([{
          "type": "flex",
          "altText": "แจ้งเตือนภัย: " + data.dis,
          "contents": {
            "type": "bubble", "size": "mega",
            "body": {
              "type": "box", "layout": "vertical", "paddingAll": "0px",
              "contents": [
                { "type": "image", "url": data.bimg, "position": "absolute", "size": "full", "aspectMode": "cover" },
                { "type": "box", "layout": "vertical", "contents": [
                  { "type": "box", "layout": "horizontal", "paddingAll": "15px", "backgroundColor": "#00000099", "alignItems": "center", "contents": [
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "cornerRadius": "100px", "borderWidth": "2px", "borderColor": "#ffffff", "contents": [{ "type": "image", "url": data.limg, "aspectMode": "cover", "size": "full" }] },
                    { "type": "box", "layout": "vertical", "flex": 4, "contents": [
                      { "type": "text", "text": "ศูนย์ข้อมูลน้ำ", "weight": "bold", "size": "lg", "color": "#ffffff", "align": "center" },
                      { "type": "text", "text": "กอ.รมน.ภาค 3", "weight": "bold", "size": "sm", "color": "#ffffff", "align": "center" }
                    ]},
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "cornerRadius": "100px", "borderWidth": "2px", "borderColor": "#ffffff", "contents": [{ "type": "image", "url": data.rimg, "aspectMode": "cover", "size": "full" }] }
                  ]},
                  { "type": "box", "layout": "vertical", "backgroundColor": isUrgent ? "#b22222" : "#FF9500", "paddingAll": "10px", "contents": [{ "type": "text", "text": isUrgent ? "🚨 เฝ้าระวังสูงสุด (ภายใน 24 ชม.)" : "⚠️ เฝ้าระวังล่วงหน้า (ภายใน 48 ชม.)", "color": "#ffffff", "weight": "bold", "size": "md", "align": "center" }] },
                  { "type": "box", "layout": "vertical", "backgroundColor": "#ffffff", "paddingAll": "20px", "contents": [
                    { "type": "box", "layout": "vertical", "cornerRadius": "md", "contents": [{ "type": "image", "url": data.mimg, "size": "full", "aspectRatio": "16:9", "aspectMode": "cover" }] },
                    { "type": "box", "layout": "vertical", "margin": "lg", "spacing": "sm", "contents": [
                      { "type": "box", "layout": "baseline", "spacing": "sm", "contents": [{ "type": "text", "text": "พิกัด:", "color": "#888888", "size": "md", "flex": 1 }, { "type": "text", "text": data.loc, "wrap": true, "color": "#000000", "size": "md", "flex": 4, "weight": "bold" } ]},
                      { "type": "box", "layout": "baseline", "spacing": "sm", "contents": [{ "type": "text", "text": "ภัย:", "color": "#888888", "size": "md", "flex": 1 }, { "type": "text", "text": data.dis, "wrap": true, "color": isUrgent ? "#FF3B30" : "#FF9500", "size": "md", "flex": 4, "weight": "bold" } ]}
                    ]},
                    { "type": "text", "text": data.det, "wrap": true, "margin": "lg", "size": "sm", "color": "#333333" }
                  ]}
                ]},
                { "type": "box", "layout": "horizontal", "spacing": "md", "backgroundColor": "#ffffff", "paddingAll": "20px", "paddingTop": "10px", "contents": [
                  { "type": "button", "style": "primary", "color": isUrgent ? "#b22222" : "#FF9500", "height": "sm", "action": { "type": "uri", "label": "อ่านเพิ่ม", "uri": data.link } },
                  { "type": "button", "style": "secondary", "height": "sm", "action": { "type": "uri", "label": "แชร์ต่อ", "uri": shareUrl } } // ใช้ลิงก์สั้นที่แปลงมาแล้ว
                ]}
              ]
            }
          }
        }]);

        if (result) { 
          liff.closeWindow(); 
        } else {
          document.getElementById('status').innerText = "ยกเลิกการแชร์ หรือแชร์ไม่สำเร็จ";
        }
      } catch (err) {
        document.getElementById('status').innerText = "เกิดข้อผิดพลาด: " + err.message;
        alert("กรุณาตรวจสอบลิงก์หรือรูปภาพอีกครั้ง: " + err.message);
      }
    }
    
    main();
  </script>
</body>
</html>
