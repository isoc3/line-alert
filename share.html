<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแชร์ ศนป.กอ.รมน.</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .loader { border: 6px solid #f3f3f3; border-top: 6px solid #06C755; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { margin-top: 20px; font-weight: bold; color: #333; text-align: center; line-height: 1.6; }
    .btn-group { display: none; margin-top: 20px; gap: 10px; }
    button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
    .btn-retry { background-color: #06C755; color: white; }
    .btn-close { background-color: #888; color: white; }
  </style>
</head>
<body>
  <div id="loader" class="loader"></div>
  <p id="status">กำลังดึงข้อมูลฐานข้อมูล...</p>
  <div id="btnGroup" class="btn-group">
    <button class="btn-retry" onclick="location.reload()">แชร์ใหม่</button>
    <button class="btn-close" onclick="liff.closeWindow()">ปิด</button>
  </div>

  <script>
    const LIFF_ID = "2010041585-Xig31aUQ"; 
    
    // 🚨 1. URL ของแอปเว็บกูเกิลของคุณ
    const API_URL = "https://script.google.com/macros/s/AKfycbxHjLlWb3tOIOGkizcdAn1cFYd9a_NM7du7Nw3KM5WDEH-B17pbGIINsKTmi2-RpdO8Pw/exec"; 

    // 🚨 2. ใส่ ID รูปภาพแบบคงที่ของคุณตรงนี้
    const BG_IMG_ID = "1BN7SKJAsPCyBx3cUV_LNDXRcjnP86Th1";
    const LOGO_LEFT_ID = "1BN7SKJAsPCyBx3cUV_LNDXRcjnP86Th1";
    const LOGO_RIGHT_ID = "1Qz3iZQzMrrFkcG_G-F9Mgm6pF7Ljw79M";

    let rowId = null;

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        
        const p = new URLSearchParams(window.location.search);
        rowId = p.get('id');
        
        if (!rowId) {
          document.getElementById('loader').style.display = "none";
          document.getElementById('status').innerText = "❌ ไม่พบรหัสรายงาน (ID) ในลิงก์";
          return;
        }

        // 🚨 3. เปลี่ยนจาก fetch มาใช้ JSONP เพื่อทะลุกำแพงบล็อก CORS ขององค์กร
        const script = document.createElement('script');
        script.src = API_URL + "?id=" + rowId + "&callback=liffCallback";
        document.body.appendChild(script);

      } catch (e) { 
        document.getElementById('loader').style.display = "none";
        document.getElementById('status').innerText = "❌ Error: " + e.message; 
      }
    }

    // 🚨 4. ฟังก์ชันรับข้อมูลกลับจาก Google Apps Script และสั่งเปิดแชร์หน้าต่างไลน์
    async function liffCallback(res) {
      try {
        if (!res || res === "Error") {
          throw new Error("ไม่พบข้อมูลรายงานในชีต Database");
        }

        const getImg = (id) => (id && id.trim() !== "") ? "https://drive.google.com/uc?export=view&id=" + id.trim() : "https://via.placeholder.com/800";
        const getView = (id) => (id && id.trim() !== "") ? "https://drive.google.com/file/d/" + id.trim() + "/view?usp=sharing" : "https://www.isoc.go.th/";
        
        let locList = res.l_raw.split(",").map(item => { 
          let pts = item.split("|"); 
          return `- จ.${pts[2]} อ.${pts[1]} ต.${pts[0]}`; 
        });
        
        const flexShareUrl = "https://liff.line.me/" + LIFF_ID + "?id=" + rowId;

        // สั่งเปิดหน้าต่างเลือกเพื่อน/กลุ่มไลน์ เพื่อแชร์ข้อมูล
        await liff.shareTargetPicker([{
          "type": "flex",
          "altText": "🚨 แจ้งเตือนภัย: " + res.dis,
          "contents": {
            "type": "bubble", 
            "size": "giga", 
            "body": {
              "type": "box", "layout": "vertical", "paddingAll": "0px",
              "contents": [
                { "type": "image", "url": getImg(BG_IMG_ID), "position": "absolute", "size": "full", "aspectMode": "cover" },
                { "type": "box", "layout": "vertical", "contents": [
                  { "type": "box", "layout": "horizontal", "paddingAll": "15px", "backgroundColor": "#00000099", "contents": [
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "contents": [{ "type": "image", "url": getImg(LOGO_LEFT_ID), "size": "full" }] },
                    { "type": "box", "layout": "vertical", "flex": 4, "contents": [{ "type": "text", "text": "ศูนย์ข้อมูลน้ำ", "weight": "bold", "color": "#ffffff", "align": "center" }, { "type": "text", "text": "กอ.รมน.ภาค 3", "size": "sm", "color": "#ffffff", "align": "center" }] },
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "contents": [{ "type": "image", "url": getImg(LOGO_RIGHT_ID), "size": "full" }] }
                  ]},
                  { "type": "box", "layout": "vertical", "backgroundColor": res.type == "24" ? "#b22222" : "#FF9500", "paddingAll": "10px", "contents": [{ "type": "text", "text": res.type == "24" ? "🚨 เฝ้าระวังสูงสุด (24 ชม.)" : "⚠️ เฝ้าระวังล่วงหน้า (48 ชม.)", "color": "#ffffff", "weight": "bold", "align": "center" }] },
                  { "type": "box", "layout": "vertical", "backgroundColor": "#ffffff", "paddingAll": "20px", "contents": [
                    { "type": "box", "layout": "vertical", "cornerRadius": "md", "contents": [{ "type": "image", "url": getImg(res.m), "size": "full", "aspectRatio": "16:9", "aspectMode": "cover", "action": { "type": "uri", "uri": getView(res.m) } }] },
                    { "type": "box", "layout": "vertical", "margin": "lg", "contents": [
                      { "type": "text", "text": "พื้นที่เฝ้าระวัง:", "color": "#888888", "size": "sm" },
                      { "text": locList.join("\n"), "type": "text", "wrap": true, "weight": "bold", "size": "sm" },
                      { "text": "ภัย: " + res.dis, "type": "text", "weight": "bold", "color": res.type == "24" ? "#FF3B30" : "#FF9500", "margin": "md", "wrap": true },
                      { "text": res.det, "type": "text", "wrap": true, "size": "sm", "margin": "sm", "color": "#333333" },
                      { "type": "text", "text": "🕒 ข้อมูล ณ วันที่ " + res.tm, "size": "xs", "color": "#aaaaaa", "margin": "xl" }
                    ]}
                  ]}
                ]},
                { "type": "box", "layout": "horizontal", "backgroundColor": "#ffffff", "paddingAll": "20px", "contents": [
                  { "type": "button", "style": "primary", "color": res.type == "24" ? "#b22222" : "#FF9500", "action": { "type": "uri", "label": "อ่านเพิ่ม", "uri": res.u } },
                  { "type": "button", "style": "secondary", "action": { "type": "uri", "label": "แชร์ต่อ", "uri": flexShareUrl } } 
                ]}
              ]
            }
          }
        }]);

        liff.closeWindow(); // ทำการแชร์เสร็จสมบูรณ์ ให้ปิดหน้าจออัตโนมัติ

      } catch (err) {
        document.getElementById('loader').style.display = "none";
        document.getElementById('status').innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
        document.getElementById('btnGroup').style.display = "flex";
      }
    }

    main();
  </script>
</body>
</html>
