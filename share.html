<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Share</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f3f4f6; margin: 0; text-align: center; }
    #status { padding: 20px; font-weight: bold; color: #333; }
    .btn { padding: 10px 20px; background: #06C755; color: white; border: none; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="status">กำลังตรวจสอบระบบ...</div>
  <button id="recheckBtn" class="btn" style="display:none;" onclick="location.reload()">ลองใหม่อีกครั้ง</button>

  <script>
    const LIFF_ID = "2010041585-Xig31aUQ"; 

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const p = new URLSearchParams(window.location.search);
        
        // 🚨 จุดเช็กที่ 1: ตรวจสอบรูปภาพ (LINE บังคับ HTTPS และห้ามมีค่าว่าง)
        const getImg = (val) => {
          if (!val || val.includes("undefined") || val === "") return "https://via.placeholder.com/800x450.png?text=Missing+Image";
          return val.trim();
        };

        const data = {
          type: p.get('type') || "24",
          loc: p.get('loc') || "ไม่ระบุพื้นที่",
          dis: p.get('dis') || "แจ้งเตือนภัย",
          det: p.get('det') || "-",
          mimg: getImg(p.get('mimg')),
          link: p.get('link') || "https://www.isoc.go.th/",
          bimg: getImg(p.get('bimg')),
          limg: getImg(p.get('limg')),
          rimg: getImg(p.get('rimg'))
        };

        document.getElementById('status').innerText = "กำลังเรียกหน้าจอแชร์...";

        // 🚨 จุดเช็กที่ 2: ลองส่งแบบ Simple Flex ก่อนเพื่อทดสอบท่อส่ง
        const result = await liff.shareTargetPicker([
          {
            "type": "flex",
            "altText": "🚨 แจ้งเตือนภัย: " + data.dis,
            "contents": {
              "type": "bubble",
              "body": {
                "type": "box",
                "layout": "vertical",
                "contents": [
                  { "type": "text", "text": "ศนป.กอ.รมน. แจ้งเตือนภัย", "weight": "bold", "color": "#1DB446", "size": "sm" },
                  { "type": "text", "text": data.dis, "weight": "bold", "size": "xl", "margin": "md" },
                  { "type": "text", "text": data.loc, "size": "xs", "color": "#aaaaaa", "wrap": true },
                  { "type": "separator", "margin": "xxl" },
                  { "type": "image", "url": data.mimg, "size": "full", "aspectRatio": "20:13", "aspectMode": "cover", "margin": "md" },
                  { "type": "text", "text": data.det, "margin": "md", "size": "sm", "wrap": true },
                  { "type": "button", "style": "primary", "color": "#06C755", "margin": "md", "action": { "type": "uri", "label": "ดูรายละเอียด", "uri": data.link } }
                ]
              }
            }
          }
        ]);

        if (result) {
          alert("✅ ส่งข้อมูลสำเร็จ!");
          liff.closeWindow();
        } else {
          document.getElementById('status').innerText = "⚠️ คุณยกเลิกการแชร์";
          document.getElementById('recheckBtn').style.display = "block";
        }

      } catch (err) {
        // 🚨 จุดเช็กที่ 3: ถ้า LINE ปฏิเสธ มันจะ Alert บอกสาเหตุตรงนี้!
        alert("❌ LINE ปฏิเสธการส่ง: " + err.message);
        document.getElementById('status').innerText = "ข้อผิดพลาด: " + err.message;
      }
    }
    main();
  </script>
</body>
</html>
