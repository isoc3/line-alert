<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแชร์ ศนป.กอ.รมน.</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f4f7f6; margin: 0; }
    .loader { border: 6px solid #f3f3f3; border-top: 6px solid #06C755; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { margin-top: 20px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p id="status">กำลังดึงข้อมูลพื้นที่ทั้งหมด...</p>

  <script>
    const LIFF_ID = "2010041585-Xig31aUQ"; 
    // 🚨 นำ URL แอปเว็บที่คุณ Deploy มาวางตรงนี้
    const API_URL = "https://script.google.com/macros/s/AKfycbyHmSEnS7r11kiO0ihn_cWq6DgQvY_focI4OeRC8uiApqEr5KqP861or4BMCmLHm3pz/exec";

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const p = new URLSearchParams(window.location.search);
        const rowId = p.get('id');
        if (!rowId) throw new Error("ไม่พบรหัสแถวข้อมูล");

        // ดึงข้อมูลจาก Google Sheets API
        const response = await fetch(API_URL + "?id=" + rowId);
        const res = await response.json();
        if(res.error) throw new Error(res.error);

        const getImg = (id) => "https://drive.google.com/uc?export=view&id=" + id;
        
        // จัดการพื้นที่ (แตกคอมม่าแสดงผลแยกบรรทัด)
        const t = String(res.t).split(",");
        const a = String(res.a).split(",");
        const j = String(res.j).split(",");
        let locList = [];
        for(let i=0; i < Math.max(t.length, a.length, j.length); i++) {
          locList.push(`- จ.${(j[i]||"-").trim()} อ.${(a[i]||"-").trim()} ต.${(t[i]||"-").trim()}`);
        }

        await liff.shareTargetPicker([{
          "type": "flex",
          "altText": "🚨 แจ้งเตือนภัย: " + res.dis,
          "contents": {
            "type": "bubble", "size": "mega",
            "body": {
              "type": "box", "layout": "vertical", "paddingAll": "0px",
              "contents": [
                { "type": "image", "url": getImg(res.b), "position": "absolute", "size": "full", "aspectMode": "cover" },
                { "type": "box", "layout": "vertical", "contents": [
                  { "type": "box", "layout": "horizontal", "paddingAll": "15px", "backgroundColor": "#00000099", "contents": [
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "contents": [{ "type": "image", "url": getImg(res.lg), "size": "full" }] },
                    { "type": "box", "layout": "vertical", "flex": 4, "contents": [{ "type": "text", "text": "ศูนย์ข้อมูลน้ำ", "weight": "bold", "color": "#ffffff", "align": "center" }, { "type": "text", "text": "กอ.รมน.ภาค 3", "size": "sm", "color": "#ffffff", "align": "center" }] },
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "contents": [{ "type": "image", "url": getImg(res.rg), "size": "full" }] }
                  ]},
                  { "type": "box", "layout": "vertical", "backgroundColor": res.type == "24" ? "#b22222" : "#FF9500", "paddingAll": "10px", "contents": [{ "type": "text", "text": res.type == "24" ? "🚨 เฝ้าระวังสูงสุด" : "⚠️ เฝ้าระวังล่วงหน้า", "color": "#ffffff", "weight": "bold", "align": "center" }] },
                  { "type": "box", "layout": "vertical", "backgroundColor": "#ffffff", "paddingAll": "20px", "contents": [
                    { "type": "box", "layout": "vertical", "cornerRadius": "md", "contents": [{ "type": "image", "url": getImg(res.m), "size": "full", "aspectRatio": "16:9", "aspectMode": "cover" }] },
                    { "type": "box", "layout": "vertical", "margin": "lg", "contents": [
                      { "type": "text", "text": "พื้นที่เฝ้าระวัง:", "color": "#888888", "size": "sm" },
                      { "type": "text", "text": locList.join("\n"), "wrap": true, "weight": "bold", "size": "sm" },
                      { "type": "text", "text": "ภัย: " + res.dis, "weight": "bold", "color": res.type == "24" ? "#FF3B30" : "#FF9500", "margin": "md" },
                      { "type": "text", "text": res.det, "wrap": true, "size": "sm", "margin": "sm" }
                    ]}
                  ]}
                ]},
                { "type": "box", "layout": "horizontal", "backgroundColor": "#ffffff", "paddingAll": "20px", "contents": [
                  { "type": "button", "style": "primary", "color": res.type == "24" ? "#b22222" : "#FF9500", "action": { "type": "uri", "label": "อ่านเพิ่ม", "uri": res.u } },
                  { "type": "button", "style": "secondary", "action": { "type": "uri", "label": "แชร์ต่อ", "uri": window.location.href } }
                ]}
              ]
            }
          }
        }]);
        liff.closeWindow(); 
      } catch (err) {
        document.getElementById('status').innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
      }
    }
    main();
  </script>
</body>
</html>
