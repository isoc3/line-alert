<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแชร์ ศนป.กอ.รมน.</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
    .loader { border: 5px solid #f3f3f3; border-top: 5px solid #06C755; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { margin-top: 20px; color: #333; font-weight: bold; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p id="status">กำลังเตรียมข้อมูลปลอดภัย...</p>

  <script>
    const LIFF_ID = "2010041585-Xig31aUQ"; 

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const p = new URLSearchParams(window.location.search);
        
        // 🛡️ ดึงรูปจาก Drive ตรง (รักษาความลับ)
        const getImg = (id) => (id && id !== "undefined" && id !== "") ? "https://drive.google.com/uc?export=view&id=" + id : "https://via.placeholder.com/800x450.png?text=No+Image";

        // คืนร่างพิกัด (Sync 100%)
        let locStr = "ไม่ระบุพื้นที่";
        if (p.get('l')) {
          const pts = p.get('l').split(',');
          if(pts.length === 3) locStr = `ต.${pts[0]} อ.${pts[1]} จ.${pts[2]}`;
        }

        const data = {
          type: p.get('t') || "24",
          loc: locStr,
          dis: p.get('d') || "แจ้งเตือนภัย",
          det: p.get('de') || "-",
          mimg: getImg(p.get('m')),
          link: p.get('u') || "https://www.isoc.go.th/",
          bimg: getImg(p.get('b')),
          limg: getImg(p.get('lg')),
          rimg: getImg(p.get('rg'))
        };

        const isUrgent = (data.type == "24");
        
        // ลิงก์สำหรับปุ่มแชร์ต่อ (ใช้ลิงก์ปัจจุบันแบบ Full ไม่ผ่านตัวย่อ)
        const shareUrl = window.location.href;

        document.getElementById('status').innerText = "เลือกเพื่อนหรือกลุ่มที่ต้องการแชร์";

        await liff.shareTargetPicker([{
          "type": "flex",
          "altText": "🚨 แจ้งเตือนภัย: " + data.dis,
          "contents": {
            "type": "bubble", "size": "mega",
            "body": {
              "type": "box", "layout": "vertical", "paddingAll": "0px",
              "contents": [
                { "type": "image", "url": data.bimg, "position": "absolute", "size": "full", "aspectMode": "cover" },
                { "type": "box", "layout": "vertical", "contents": [
                  { "type": "box", "layout": "horizontal", "paddingAll": "15px", "backgroundColor": "#00000099", "alignItems": "center", "contents": [
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "cornerRadius": "100px", "borderWidth": "2px", "borderColor": "#ffffff", "contents": [{ "type": "image", "url": data.limg, "aspectMode": "cover", "size": "full" }] },
                    { "type": "box", "layout": "vertical", "flex": 4, "contents": [
                      { "type": "text", "text": "ศูนย์ข้อมูลน้ำ", "weight": "bold", "size": "lg", "color": "#ffffff", "align": "center" },
                      { "type": "text", "text": "กอ.รมน.ภาค 3", "weight": "bold", "size": "sm", "color": "#ffffff", "align": "center" }
                    ]},
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "cornerRadius": "100px", "borderWidth": "2px", "borderColor": "#ffffff", "contents": [{ "type": "image", "url": data.rimg, "aspectMode": "cover", "size": "full" }] }
                  ]},
                  { "type": "box", "layout": "vertical", "backgroundColor": isUrgent ? "#b22222" : "#FF9500", "paddingAll": "10px", "contents": [{ "type": "text", "text": isUrgent ? "🚨 เฝ้าระวังสูงสุด (ภายใน 24 ชม.)" : "⚠️ เฝ้าระวังล่วงหน้า (ภายใน 48 ชม.)", "color": "#ffffff", "weight": "bold", "size": "md", "align": "center" }] },
                  { "type": "box", "layout": "vertical", "backgroundColor": "#ffffff", "paddingAll": "20px", "contents": [
                    { "type": "box", "layout": "vertical", "cornerRadius": "md", "contents": [{ "type": "image", "url": data.mimg, "size": "full", "aspectRatio": "16:9", "aspectMode": "cover" }] },
                    { "type": "box", "layout": "vertical", "margin": "lg", "spacing": "sm", "contents": [
                      { "type": "box", "layout": "baseline", "spacing": "sm", "contents": [{ "type": "text", "text": "พิกัด:", "color": "#888888", "size": "md", "flex": 1 }, { "type": "text", "text": data.loc, "wrap": true, "color": "#000000", "size": "md", "flex": 4, "weight": "bold" } ]},
                      { "type": "box", "layout": "baseline", "spacing": "sm", "contents": [{ "type": "text", "text": "ภัย:", "color": "#888888", "size": "md", "flex": 1 }, { "type": "text", "text": data.dis, "wrap": true, "color": isUrgent ? "#FF3B30" : "#FF9500", "size": "md", "flex": 4, "weight": "bold" } ]}
                    ]},
                    { "type": "text", "text": data.det, "wrap": true, "margin": "lg", "size": "sm", "color": "#333333" }
                  ]}
                ]},
                { "type": "box", "layout": "horizontal", "spacing": "md", "backgroundColor": "#ffffff", "paddingAll": "20px", "paddingTop": "10px", "contents": [
                  { "type": "button", "style": "primary", "color": isUrgent ? "#b22222" : "#FF9500", "height": "sm", "action": { "type": "uri", "label": "อ่านเพิ่ม", "uri": data.link } },
                  { "type": "button", "style": "secondary", "height": "sm", "action": { "type": "uri", "label": "แชร์ต่อ", "uri": shareUrl } } 
                ]}
              ]
            }
          }
        }]);

        liff.closeWindow(); 
      } catch (err) {
        document.getElementById('status').innerText = "Error: " + err.message;
      }
    }
    main();
  </script>
</body>
</html>
