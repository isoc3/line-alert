<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแชร์ข่าวเตือนภัย</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f3f4f6; margin: 0; text-align: center; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #06C755; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { margin-top: 20px; color: #333; padding: 0 20px; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p id="status">กำลังเตรียมข้อมูลการแชร์...</p>

  <script>
    const LIFF_ID = "2010041585-Xig31aUQ"; // LIFF ID ของคุณ

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        // ดึงค่าจาก URL ที่ส่งมาจาก Google Sheets
        const params = new URLSearchParams(window.location.search);
        
        const flexData = {
          type: params.get('type') || "24",
          loc: params.get('loc') || "ไม่ระบุพื้นที่",
          dis: params.get('dis') || "แจ้งเตือนภัย",
          det: params.get('det') || "-",
          mimg: params.get('mimg') || "",
          link: params.get('link') || "",
          bimg: params.get('bimg') || "",
          limg: params.get('limg') || "",
          rimg: params.get('rimg') || ""
        };

        const isUrgent = (flexData.type == "24");

        // เรียกหน้าจอเลือกเพื่อนเพื่อแชร์ Flex Message
        await liff.shareTargetPicker([{
          "type": "flex",
          "altText": "แจ้งเตือนภัย: " + flexData.dis,
          "contents": {
            "type": "bubble", "size": "mega",
            "body": {
              "type": "box", "layout": "vertical", "paddingAll": "0px",
              "contents": [
                { "type": "image", "url": flexData.bimg, "position": "absolute", "size": "full", "aspectMode": "cover" },
                { "type": "box", "layout": "vertical", "contents": [
                  { "type": "box", "layout": "horizontal", "paddingAll": "15px", "backgroundColor": "#00000099", "alignItems": "center", "contents": [
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "cornerRadius": "100px", "borderWidth": "2px", "borderColor": "#ffffff", "contents": [{ "type": "image", "url": flexData.limg, "aspectMode": "cover", "size": "full" }] },
                    { "type": "box", "layout": "vertical", "flex": 4, "contents": [{ "type": "text", "text": "ศูนย์ข้อมูลน้ำ", "weight": "bold", "size": "lg", "color": "#ffffff", "align": "center" }, { "type": "text", "text": "กอ.รมน.ภาค 3", "weight": "bold", "size": "sm", "color": "#ffffff", "align": "center" }] },
                    { "type": "box", "layout": "vertical", "width": "50px", "height": "50px", "cornerRadius": "100px", "borderWidth": "2px", "borderColor": "#ffffff", "contents": [{ "type": "image", "url": flexData.rimg, "aspectMode": "cover", "size": "full" }] }
                  ]},
                  { "type": "box", "layout": "vertical", "backgroundColor": isUrgent ? "#b22222" : "#FF9500", "paddingAll": "10px", "contents": [{ "type": "text", "text": isUrgent ? "🚨 เฝ้าระวังสูงสุด (ภายใน 24 ชม.)" : "⚠️ เฝ้าระวังล่วงหน้า (ภายใน 48 ชม.)", "color": "#ffffff", "weight": "bold", "size": "md", "align": "center" }] },
                  { "type": "box", "layout": "vertical", "backgroundColor": "#ffffff", "paddingAll": "20px", "contents": [
                    { "type": "box", "layout": "vertical", "cornerRadius": "md", "contents": [{ "type": "image", "url": flexData.mimg, "size": "full", "aspectRatio": "16:9", "aspectMode": "cover" }] },
                    { "type": "box", "layout": "vertical", "margin": "lg", "spacing": "sm", "contents": [
                      { "text": "พิกัด:", "type": "text", "color": "#888888", "size": "md", "flex": 1, "layout": "baseline" }, 
                      { "text": flexData.loc, "type": "text", "wrap": true, "color": "#000000", "size": "md", "flex": 4, "weight": "bold" }
                    ]},
                    { "type": "text", "text": flexData.det, "wrap": true, "margin": "lg", "size": "sm", "color": "#333333" }
                  ]}
                ]},
                { "type": "box", "layout": "horizontal", "spacing": "md", "backgroundColor": "#ffffff", "paddingAll": "20px", "paddingTop": "10px", "contents": [
                  { "type": "button", "style": "primary", "color": isUrgent ? "#b22222" : "#FF9500", "height": "sm", "action": { "type": "uri", "label": "อ่านเพิ่ม", "uri": flexData.link } }
                ]}
              ]
            }
          }
        }]);
        
        liff.closeWindow(); // ส่งเสร็จปิดหน้าต่างทันที
      } catch (err) {
        document.getElementById('status').innerText = "เกิดข้อผิดพลาด: " + err.message;
      }
    }
    main();
  </script>
</body>
</html>
